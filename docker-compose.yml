services:
  api:
    container_name: uo-news-api
    build:
      context: ./uo-news-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./uo-news-api/.env
    environment:
      - UO_NEWS_ROOT=/app
    volumes:
      - uo-news-data:/app/data
      - uo-news-db:/app/db
      - uo-news-logs:/app/logs
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  uo-news-data:
  uo-news-db:
  uo-news-logs:
