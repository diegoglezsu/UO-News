[project]
name = "uo-news"
version = "0.1.0"
description = "UO-News API"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.27.0",
    "spacy>=3.7.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "seqeval>=1.2.2",
    "sentence-transformers>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
